name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # All lexemes are still `draft` pending native-speaker review (CLAUDE.md §10).
      # Drop --allow-draft once the shipped packs are approved; release builds must run without it.
      - run: pnpm validate-content --allow-draft
      - run: pnpm build-packs --check
